name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ── Backend: Spring Boot 빌드 + 테스트 ─────────────────────────
  backend:
    name: Backend (Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Fix gradlew line endings & permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Restore gradle-wrapper.jar if missing
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar not found — downloading..."
            GRADLE_VER=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties \
              | grep -oP 'gradle-\K[0-9]+\.[0-9]+(\.[0-9]+)?')
            curl -sL "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" \
              -o /tmp/gradle.zip
            unzip -jo /tmp/gradle.zip \
              "gradle-${GRADLE_VER}/lib/plugins/gradle-wrapper-*.jar" \
              -d /tmp/gwjar/
            mkdir -p gradle/wrapper
            cp /tmp/gwjar/gradle-wrapper-*.jar gradle/wrapper/gradle-wrapper.jar
            echo "gradle-wrapper.jar restored (${GRADLE_VER})"
          else
            echo "gradle-wrapper.jar already present ✅"
          fi

      - name: Build & Test
        run: ./gradlew test --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: JUnit Test Report
          path: build/test-results/test/*.xml
          reporter: java-junit

  # ── Frontend: React 빌드 ────────────────────────────────────────
  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8080

  # ── Python embed_server: 린트 + 임포트 체크 ─────────────────────
  embed-server:
    name: Embed Server (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: embed_server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check syntax (py_compile)
        run: python -m py_compile main.py
