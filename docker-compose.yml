version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: knotnote-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root1234!
      MYSQL_DATABASE: knotnote
      MYSQL_USER: knotnote
      MYSQL_PASSWORD: knotnote1234!
    ports:
      - "3306:3306"
    volumes:
      - knotnote-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  knotnote-mysql-data:
