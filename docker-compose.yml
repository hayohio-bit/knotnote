version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: knotnote-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root1234!
      MYSQL_DATABASE: knotnote
      MYSQL_USER: knotnote
      MYSQL_PASSWORD: knotnote1234!
    volumes:
      - knotnote-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - knotnote-net

  embed_server:
    build:
      context: ./embed_server
    container_name: knotnote-embed
    restart: unless-stopped
    networks:
      - knotnote-net

  backend:
    build:
      context: .
    container_name: knotnote-backend
    restart: unless-stopped
    depends_on:
      - mysql
      - embed_server
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: knotnote
      DB_PASSWORD: knotnote1234!
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (at least 32 bytes)}
      EMBED_HOST: embed_server
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    networks:
      - knotnote-net

  frontend:
    build:
      context: ./frontend
    container_name: knotnote-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - knotnote-net

  caddy:
    image: caddy:2-alpine
    container_name: knotnote-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - knotnote-net

networks:
  knotnote-net:

volumes:
  knotnote-mysql-data:
  caddy_data:
  caddy_config:
